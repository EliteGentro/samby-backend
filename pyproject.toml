[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "base-monolith-backend"
version = "0.1.0"
description = "Neutral FastAPI base monolith"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.141,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.15,<3",
  "PyJWT>=2.14,<3",
  "pwdlib[argon2]>=0.3,<1",
  "redis>=8.1,<9",
  "sqlalchemy[asyncio]>=2.0.52,<3",
  "uvicorn[standard]>=0.41,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.22,<1",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]
markers = [
  "health: live dependency checks; run separately with pytest tests/health -m health",
]
